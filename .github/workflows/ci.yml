name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test applications
        run: npm test

      - name: Lint applications
        run: npm run lint

      - name: Smoke test real local stack
        run: npm run smoke

      - name: Build applications
        run: npm run build

      - name: Install browser for household verification
        run: npx playwright install --with-deps chromium

      - name: Verify household browser journeys
        run: npm run smoke:browser
        env:
          HOMEOS_SKIP_BUILD: "1"
          HOMEOS_BROWSER_CHANNEL: chromium

      - name: Upload household browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: household-browser-evidence
          path: test-results/household/
          if-no-files-found: ignore

      - name: Verify personal MCP and browser session boundaries
        run: npm run smoke:mcp
        env:
          HOMEOS_SKIP_BUILD: "1"
          HOMEOS_BROWSER_CHANNEL: chromium

      - name: Verify installed PWA upgrade preserves queued work
        run: npm run smoke:upgrade
        env:
          HOMEOS_SKIP_BUILD: "1"
          HOMEOS_BROWSER_CHANNEL: chromium

      - name: Upload access and PWA upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-upgrade-evidence
          path: |
            test-results/mcp-browser/
            test-results/pwa-upgrade/
          if-no-files-found: ignore
